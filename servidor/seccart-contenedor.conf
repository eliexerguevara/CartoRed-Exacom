# Apache dentro del contenedor de CartoRed: un solo sitio, sin archivos de log en disco.
# Los errores van a la salida de errores del contenedor (en RouterOS: /log con logging=yes);
# el registro de accesos queda apagado para no llenar el log de RouterOS en memoria.
ServerName localhost
ServerTokens Prod
ServerSignature Off
DocumentRoot /var/www/html
ErrorLog "|/bin/cat 1>&2"
LogLevel warn
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
# La raiz lleva al mapa
RedirectMatch 302 ^/$ /mapa/
