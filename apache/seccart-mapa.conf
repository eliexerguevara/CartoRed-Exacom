# Visor web de SecureCartography2 (http://<servidor>/mapa)
# El acceso lo controla la propia aplicacion (login.php, usuarios en /var/lib/seccart-web/cuentas).
<Directory /var/www/html/mapa>
    Options -Indexes
    DirectoryIndex index.php
    Require all granted
    <FilesMatch "^(lib\.php|.*\.(bak[0-9]*|tmp))$">
        Require all denied
    </FilesMatch>
</Directory>
# Los datos de los mapas solo se entregan con sesion iniciada (datos.php)
<Directory /var/www/html/mapa/data>
    Require all denied
</Directory>
# Enlaces viejos al visor: pasan por viewer.php (que pide ingresar)
RedirectMatch 302 ^/mapa/viewer\.html$ /mapa/viewer.php
